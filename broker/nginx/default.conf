# Servidor estático del gemelo digital (carpeta gemelo/ del repositorio).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hora del servidor en segundos epoch con milisegundos (p. ej. 1764067200.123).
    # Sirve para estimar el desfase del reloj del navegador o del PC del alumno
    # (algoritmo de Cristian: desfase = hora_servidor + RTT/2 - hora_local).
    location = /hora {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 "$msec\n";
    }

    location / {
        try_files $uri $uri/ =404;
        # El gemelo cambia a menudo durante el curso: que el navegador revalide.
        add_header Cache-Control "no-cache";
    }
}
