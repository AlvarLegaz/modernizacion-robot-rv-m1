# Servidor MQTT del aula + servidor web del gemelo digital (contrato MQTT v0.2).
#
# Antes de arrancar:  python crear_usuarios.py   (genera config/passwd y config/acl)
# Arrancar:           docker compose up -d
# Ver registros:      docker compose logs -f mosquitto
# Tras cambiar usuarios: docker compose restart mosquitto
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: rvm1-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT/TCP (programas Python, placa del robot)
      - "9001:9001"   # MQTT/WebSocket (gemelo y pendant en el navegador)
    volumes:
      # broker/config se monta en SOLO LECTURA en /rvm1. Al arrancar se copia dentro
      # del contenedor con dueño 'mosquitto' y permisos 0600, que es lo que exige
      # Mosquitto 2 para passwd y acl. Así no se tocan los permisos de tus ficheros.
      - ./config:/rvm1:ro
      - mosquitto_data:/mosquitto/data
    command:
      - sh
      - -c
      - |
        for f in mosquitto.conf passwd acl; do
          [ -f /rvm1/$$f ] || { echo "FALTA broker/config/$$f: ejecuta 'python crear_usuarios.py'"; exit 1; }
        done
        cp /rvm1/mosquitto.conf /rvm1/passwd /rvm1/acl /mosquitto/config/
        chown mosquitto:mosquitto /mosquitto/config/passwd /mosquitto/config/acl
        chmod 0600 /mosquitto/config/passwd /mosquitto/config/acl
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf

  web:
    image: nginx:alpine
    container_name: rvm1-gemelo-web
    restart: unless-stopped
    ports:
      - "8080:80"     # http://<IP del PC del profesor>:8080
    volumes:
      - ../gemelo:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mosquitto_data:
