<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <title>RV-M1 · gemelo digital</title>
  <link rel="stylesheet" href="css/gemelo.css">
</head>
<body>
  <div id="app">
    <button id="btn-config" class="btn-config" title="Configuración" aria-label="Configuración">⚙ Configuración</button>
    <header id="barra" class="barra"></header>
    <main id="principal">
      <section id="vista3d" aria-label="Modelo 3D del RV-M1">
        <button id="btn-vista" class="btn-vista" title="Vista inicial">⟲ Vista inicial</button>
        <button id="btn-prog" class="btn-vista btn-prog" title="Ejecuta el programa cargado (en Programas… se elige o se escribe otro)">▶ Ciclo del cubo</button>
        <button id="btn-progs" class="btn-vista btn-progs" title="Escribir, guardar, cargar, importar y exportar programas (JSON)">Programas…</button>
        <button id="btn-cubo" class="btn-vista btn-cubo" title="Devuelve el cubo y la mesita a su sitio inicial">Recolocar objetos</button>
        <div id="aviso-colision" class="aviso-colision" role="alert" aria-live="assertive"><b>COLISIÓN</b><span></span></div>
        <div id="leyenda3d" class="leyenda3d" aria-hidden="true"></div>
      </section>
      <section id="pendant" class="zona-pendant"></section>
    </main>
    <div class="aviso-movil" role="note">Pensado para tableta u ordenador: en el móvil funciona, pero apilado.</div>
  </div>

  <!-- modelo headless (scripts clásicos con doble exportación Node/navegador) -->
  <script src="js/config_local.js" onerror="this.remove()"></script>   <!-- opcional, solo pruebas; no está en el repositorio -->
  <script src="js/modelo/config_rvm1.js"></script>
  <script src="js/modelo/cinematica.js"></script>
  <script src="js/modelo/controladora.js"></script>
  <script src="js/modelo/config_escena.js"></script>
  <script src="js/modelo/ajustes.js"></script>
  <script src="js/modelo/mundo.js"></script>
  <script src="js/modelo/programa.js"></script>
  <script src="js/modelo/registro.js"></script>
  <script src="js/mqtt/pasarela.js"></script>
  <script src="js/mqtt/cliente_contrato.js"></script>
  <script src="js/mqtt/transporte_mqtt.js"></script>
  <script src="js/mqtt/hora.js"></script>
  <script src="js/mqtt/estado3d.js"></script>
  <script src="js/mqtt/presentes.js"></script>
  <script src="js/interfaz/mando.js"></script>
  <script src="js/mqtt/observador_real.js"></script>
  <script src="lib/mqtt.min.js"></script>
  <!-- vistas (módulos ES; three.js local en lib/) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
