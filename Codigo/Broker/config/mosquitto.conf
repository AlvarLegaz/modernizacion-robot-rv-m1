# Mosquitto 2.x del aula RV-M1 (contrato MQTT v0.2) — configuración para Docker.
# Las rutas son las del contenedor eclipse-mosquitto:2. Para lanzar Mosquitto sin
# Docker usa Codigo/Broker/mosquitto_local.conf, que genera crear_usuarios.py.

# Mismo usuario/contraseña y ACL en todas las escuchas.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# MQTT sobre TCP: programas Python de los alumnos y placa del robot real.
listener 1883
protocol mqtt

# MQTT sobre WebSocket: gemelo y pendant en el navegador (ws://<IP>:9001).
listener 9001
protocol websockets

# Mensajes pequeños y sensibles a la latencia: desactivar Nagle.
set_tcp_nodelay true
max_packet_size 65536

# Persistencia de los mensajes retenidos (actuadores, posicion/mundo, online).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
